name: ninefold

services:
  backend:
    image: ninefold-backend:local
    build: .
    restart: unless-stopped
    env_file:
      - path: ${NINEFOLD_BACKEND_ENV_FILE:-.env}
        required: false
        format: raw
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  frontend:
    image: ninefold-frontend:local
    build: ../lore-fm-frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${NINEFOLD_SITE_ADDRESS:-:80}
    ports:
      - "${NINEFOLD_BIND_ADDRESS:-127.0.0.1}:${NINEFOLD_HTTP_PORT:-8090}:80"
      - "${NINEFOLD_BIND_ADDRESS:-127.0.0.1}:${NINEFOLD_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
