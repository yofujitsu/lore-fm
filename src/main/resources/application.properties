spring.application.name=lore-fm
spring.config.import=optional:file:./.env[.properties]
search.cache.ttl=15m
search.cache.maximum-size=1000
search.request-timeout=${SEARCH_REQUEST_TIMEOUT:2s}
search.failure-cooldown=${SEARCH_FAILURE_COOLDOWN:30s}

providers.spotify.enabled=${SPOTIFY_ENABLED:true}
providers.spotify.client-id=${SPOTIFY_CLIENT_ID:}
providers.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}
providers.spotify.market=${SPOTIFY_MARKET:US}
providers.spotify.request-timeout=${SPOTIFY_REQUEST_TIMEOUT:1500ms}
providers.spotify.api-base-url=${SPOTIFY_API_BASE_URL:https://api.spotify.com/v1}
providers.spotify.token-url=${SPOTIFY_TOKEN_URL:https://accounts.spotify.com/api/token}

providers.musicbrainz.enabled=${MUSICBRAINZ_ENABLED:false}
providers.musicbrainz.request-timeout=${MUSICBRAINZ_REQUEST_TIMEOUT:1200ms}
providers.musicbrainz.api-base-url=${MUSICBRAINZ_API_BASE_URL:https://musicbrainz.org/ws/2}
providers.musicbrainz.user-agent=${MUSICBRAINZ_USER_AGENT:Ninefold/0.1 (mailto:mail@gmail.com)}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
